# Entorno de desarrollo (Dev 1, archivo sensible). `docker compose up` levanta db → migrate → api → web.
# Perfiles opcionales: `test` (db-test + api-test) y `e2e` (Playwright).
name: tutorias

x-node-dev: &node-dev
  image: tutorias-node-dev:local
  build:
    context: .
    dockerfile: docker/node.Dockerfile
    target: dev
  user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
  working_dir: /app
  env_file:
    - path: .env
      required: false
  volumes:
    - .:/app
    # node_modules (y los anidados por workspace) viven en volúmenes con nombre compartidos:
    # binarios de Linux separados de los del host.
    - node_modules:/app/node_modules
    - node_modules_api:/app/apps/api/node_modules
    - node_modules_web:/app/apps/web/node_modules
    - node_modules_contracts:/app/packages/contracts/node_modules
    - node_modules_matching:/app/packages/matching/node_modules
    - node_modules_database:/app/database/node_modules

x-db-urls: &db-urls
  DATABASE_URL: ${DATABASE_URL:-postgres://tutorias:tutorias@db:5432/tutorias}
  DATABASE_URL_TEST: ${DATABASE_URL_TEST:-postgres://tutorias:tutorias@db:5432/tutorias_test}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tutorias}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutorias}
      POSTGRES_DB: ${POSTGRES_DB:-tutorias}
      # Proveedor de locale nativo de PG 17: lower()/ILIKE correctos con tildes y ñ.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
    ports:
      - '${DB_HOST_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *node-dev
    command: ['npm', 'run', 'setup', '-w', 'database']
    environment:
      <<: *db-urls
      SYNC_DEPS: 'true'
      ADMIN_EMAIL: ${ADMIN_EMAIL:-coordinador@tutorias.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-coordinador-dev-123}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *node-dev
    command: ['npm', 'run', 'dev', '-w', 'apps/api']
    environment:
      <<: *db-urls
      NODE_ENV: development
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-cambialo-en-produccion-0001}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Detrás del proxy de Vite: 1 salto de confianza para conocer la IP real (rate limit).
      TRUST_PROXY: 1
      CHOKIDAR_USEPOLLING: ${WATCH_POLLING:-false}
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health/ready >/dev/null || exit 1']
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 10

  web:
    <<: *node-dev
    command: ['npm', 'run', 'dev', '-w', 'apps/web']
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://api:3000}
      VITE_API_MOCKS: ${VITE_API_MOCKS:-false}
      # Solo desarrollo/demo: la página de login muestra estas credenciales para copiarlas.
      VITE_DEMO_EMAIL: ${ADMIN_EMAIL:-coordinador@tutorias.local}
      VITE_DEMO_PASSWORD: ${ADMIN_PASSWORD:-coordinador-dev-123}
      WATCH_POLLING: ${WATCH_POLLING:-false}
    ports:
      - '5173:5173'
    depends_on:
      api:
        condition: service_started

  # ── Perfil test: base efímera en memoria + runner de tests del API ──────────
  db-test:
    profiles: ['test']
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tutorias
      POSTGRES_PASSWORD: tutorias
      POSTGRES_DB: tutorias_test
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tutorias -d tutorias_test']
      interval: 2s
      timeout: 3s
      retries: 30

  api-test:
    <<: *node-dev
    profiles: ['test']
    command: ['npm', 'test', '-w', 'apps/api']
    environment:
      DATABASE_URL: postgres://tutorias:tutorias@db-test:5432/tutorias_test
      DATABASE_URL_TEST: postgres://tutorias:tutorias@db-test:5432/tutorias_test
    depends_on:
      db-test:
        condition: service_healthy

  # ── Perfil e2e: Playwright contra web (requiere el stack levantado) ─────────
  e2e:
    profiles: ['e2e']
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /e2e
    volumes:
      - ./tests/e2e:/e2e
      - e2e_node_modules:/e2e/node_modules
    environment:
      E2E_BASE_URL: http://web:5173
      E2E_EMAIL: ${ADMIN_EMAIL:-coordinador@tutorias.local}
      E2E_PASSWORD: ${ADMIN_PASSWORD:-coordinador-dev-123}
      CI: ${CI:-}
    command: ['sh', '-c', 'npm install --no-audit --no-fund && npx playwright test']
    depends_on:
      web:
        condition: service_started

volumes:
  pgdata:
  node_modules:
  node_modules_api:
  node_modules_web:
  node_modules_contracts:
  node_modules_matching:
  node_modules_database:
  e2e_node_modules:
