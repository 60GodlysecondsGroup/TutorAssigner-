# CI (Dev 1). Validaciones antes del merge, en el orden de la sección 13 del plan.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Formato, lint, tipos, tests, migraciones y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tutorias
          POSTGRES_PASSWORD: tutorias
          POSTGRES_DB: tutorias_test
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tutorias -d tutorias_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://tutorias:tutorias@localhost:5432/tutorias_test
      DATABASE_URL_TEST: postgres://tutorias:tutorias@localhost:5432/tutorias_test
      ADMIN_EMAIL: ci@tutorias.test
      ADMIN_PASSWORD: ci-password-solo-para-pruebas
      BCRYPT_COST: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: 1. Formato (Prettier)
        run: npm run format:check
      - name: 1. Lint (ESLint, incluidas las fronteras entre módulos)
        run: npm run lint
      - name: 2. Typecheck del monorepo
        run: npm run typecheck
      - name: 3. Tests unitarios
        run: npm run test:unit

      - name: 5. Migraciones desde una base vacía (up → down → up) y seeds base
        run: |
          npm run migrate -w database -- --test
          npm run migrate:down-all -w database -- --test
          npm run migrate -w database -- --test
          SEED_DEMO=false npm run seed -w database -- --test

      - name: 4. Tests de integración y de contrato contra PostgreSQL
        run: npm run test:int

      - name: 6. Build (frontend y API)
        run: npm run build

  docker:
    name: Imagen de producción
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build de la etapa prod
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/node.Dockerfile
          target: prod
          push: false
          tags: tutorias-app:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (compose.prod.yaml)
        env:
          APP_VERSION: ci
          POSTGRES_USER: tutorias
          POSTGRES_PASSWORD: ci-postgres-password
          JWT_SECRET: ci-jwt-secret-de-al-menos-32-caracteres-0000
          ADMIN_EMAIL: ci@tutorias.test
          ADMIN_PASSWORD: ci-password-solo-para-pruebas
          COOKIE_SECURE: 'false'
        run: |
          docker compose -f compose.prod.yaml up -d --no-build --wait
          curl -fsS http://localhost:8080/health/ready
          curl -fsS http://localhost:8080/login | grep -q '<div id="root">'
          curl -fsS -X POST http://localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" | grep -q '"rol":"COORDINADOR"'
      - name: Logs si falla
        if: failure()
        run: docker compose -f compose.prod.yaml logs
      - name: Apagar
        if: always()
        run: docker compose -f compose.prod.yaml down -v

  # 7. Desde H4: E2E del flujo central en cada merge a main y bajo demanda con la etiqueta `e2e`.
  e2e:
    name: E2E (Playwright)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e')) ||
      (github.event_name == 'push' && vars.E2E_ON_MAIN == 'true')
    needs: calidad
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Levantar el stack
        run: |
          cp .env.example .env
          echo "HOST_UID=$(id -u)" >> .env
          echo "HOST_GID=$(id -g)" >> .env
          docker compose up -d --build --wait
      - name: Playwright
        run: docker compose --profile e2e run --rm -e CI=true e2e
      - name: Logs si falla
        if: failure()
        run: docker compose logs
      - name: Reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          if-no-files-found: ignore
